<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedStudy | Log In | Admin</title>
    <link rel="stylesheet" href="../css/loginAdmin.css">
    <link rel="icon" href="..\..\User\images\logos\medstudyLogo.png">
</head>
<body>
    <div class="picholder">
        <img src="../images/logos/doc.png" width="100%">
    </div>

    <div class="logIn">
        <br><br>
        <div class="title">
            <h1>Hello</h1>
            <span><h1>Welcome Back!</h1></span>
        </div>
        
        <div class="logInForm">
            <h2>
                <span>Login</span>
                your account
            </h2>
            <form action="">
                <input id="admin" type="email" name="email" placeholder="Email">
                <br>
                <input id="12345" type="password" name="password" placeholder="Password">
                <br>
                <a href="">forgot password?</a>
                <br><br>
                <button type="button" onclick="showLoading('dashboard.html',0)">Log In</button>
                <br>
                <p>OR</p>
                <br>
                <button type="button" onclick="showLoading('dashboard.html',1)"><img src="..\..\User\images\logos\google.png" alt="">
                    <span>Log In with Google</span>
                </button>
            </form>
        </div>
    </div>
    

    <!--Loading-->

    <div class="popup" id="loadingPopup">
        <div class="popup-content">
            <p>Please Wait a Moment....</p>
            <img src="../../User/images/logos/medstudyLogo.png" alt="Loading" class="loading-image">
        </div>
    </div>

    <script>
        function showLoading(redirectUrl,num) {
           let name = document.getElementById("admin").value;
            let pass = document.getElementById("12345").value;


            if(name == "admin" && pass == "12345" || num == 1){
                document.getElementById('loadingPopup').style.display = 'flex';
            setTimeout(() => {
                    window.location.href = redirectUrl;
            }, 3000);

            }else{
                if(name == null || name != "admin"){
                    document.getElementById("admin").style.borderBottom = "2px solid red";
                }else{
                    document.getElementById("admin").style.borderBottom = "2px solid  #014E6F";
                }
                
                if(pass != "12345" || pass == null){
                    document.getElementById("12345").style.borderBottom = "2px solid red";
                }else{
                    document.getElementById("12345").style.borderBottom = "2px solid  #014E6F";
                }
            }

        }
    </script>
    
    
</body>
</html>
