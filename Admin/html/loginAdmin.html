<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedStudy | Log In | Admin</title>
    <link rel="stylesheet" href="../css/loginAdmin.css">
    <link rel="icon" href="..\..\User\images\logos\medstudyLogo.png">
</head>
<body>
    <div class="picholder">
        <img src="../images/logos/doc.png" width="100%">
    </div>

    <div class="logIn">
        <br><br>
        <div class="title">
            <h1>Hello</h1>
            <span><h1>Welcome Back!</h1></span>
        </div>
        
        <div class="logInForm">
            <h2>
                <span>Login</span>
                your account
            </h2>
            <form action="">
                <input type="email" name="email" placeholder="Email">
                <br>
                <input type="password" name="password" placeholder="Password">
                <br>
                <a href="">forgot password?</a>
                <br><br>
                <button type="button" onclick="showLoading('dashboard.html')">Log In</button>
                <br>
                <p>OR</p>
                <br>
                <button type="button" onclick="showLoading('dashboard.html')"><img src="..\..\User\images\logos\google.png" alt="">
                    <span>Log In with Google</span>
                </button>
            </form>
        </div>
    </div>
    

    <!--Loading-->

    <div class="popup" id="loadingPopup">
        <div class="popup-content">
            <p>Please Wait a Moment....</p>
            <img src="../../User/images/logos/medstudyLogo.png" alt="Loading" class="loading-image">
        </div>
    </div>

    <script>
        function showLoading(redirectUrl) {
            document.getElementById('loadingPopup').style.display = 'flex';
            setTimeout(() => {
                window.location.href = redirectUrl;
            }, 3000);
        }
    </script>
    
    
</body>
</html>
