<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rooms | Admin</title>
    <link rel="icon" href="../../User/images\logos\medstudyLogo.png">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/room.css">
</head>



<body>
    <div class="container">

        <aside class="sidebar">



            <br><br>
            <image src="../images/logos/adminIcon.png" width="100%"></image>
            <br><br>
            <hr>
            <ul>
                <br><br>
                <li onclick="titlechanges(1,this)">
                    <image src="../../User/images/icons/dashboard.png" width="20px"></image>
                    <span style="margin-left: 5px;">Dashboard</span>
                </li>
                <li class="pok" onclick="titlechanges(2,this)">
                    <image src="../../User/images/icons/room.png" width="20px"></image>
                    <span style="margin-left: 5px;"> Room</span>
                </li>
                <li onclick="titlechanges(3,this)">
                    <image src="../../User/images/icons/appointment.png" width="20px"></image>
                    <span style="margin-left: 5px;"> Booking</span>
                </li>

                <li onclick="titlechanges(4,this)">
                    <image src="../../User/images/icons/bar-chart.png" width="20px"></image>
                    <span style="margin-left: 5px;"> Reports</span>
                </li>
            </ul>
            <br>
            <hr>


            <br>
            <br<br><br><br><br><br><br><br><br><br><br>
                <image src="../images/logos/usep.png" width="100%"></image>

        </aside>

    </div>


    <div class="box2">



        <!--Main Containers-->





        <div class="main-container">



            <header class="header">
                <h2 id="titlename">Rooms</h2>
                <div class="header-right">
                    <div class="user-avatar">
                        <img src="../../User/images/icons/profile.png" alt="User" width="32px">
                    </div>
                    |<image onclick="openModal()" src="../images/logos/categories.png" width="30px"
                        style="cursor: pointer;"></image>
                </div>
            </header>








            <!-- ROOMS -->

            <div class="rooms-contain" id="rooms">
                <button id="room_popup_open" class="room-button" title="Add Rooms">
                    <image src="../images/logos/addroombutton.png" width="150px"></image>
                </button>


                <br><br> <br><br> <br>
                <div class="room-holder" id="cl">
                    <div class="r1" onclick="addroom()">
                        <image id="bigpic" src="../images/logos/studyroom.png" width="100%"></image>
                    </div>

                    <div class="r2">


                        <h1 class="des" id="roomid">Study Room 1</h1>
                        <br>
                        <table>
                            <tr>
                                <td>
                                    <image src="../images/people.png" width="40px"></image>
                                </td>
                                <td>
                                    <h4 class="des"><b id="student_num">5</b> Students</h4>
                                </td>
                            </tr>

                            <tr>
                                <td>
                                    <image src="../images/logos/chair.png" width="40px"></image>
                                </td>
                                <td>
                                    <h4 class="des"><b id="chair_num">5</b> Chairs</h4>
                                </td>
                            </tr>

                            <tr>
                                <td>
                                    <image src="../images/logos/table.png" width="40px"></image>
                                </td>
                                <td>
                                    <h4 class="des"><b id="table_num">1</b> Table</h4>
                                </td>
                            </tr>
                        </table>




                    </div>

                    <div class="r3">
                        <div class="ts" id="room-edit-open">
                            <image src="../images/logos/edit.png" width="30px"></image>
                        </div>
                        <br><br><br><br><br><br><br><br><br><br>
                        <div align="right">
                            <h3 id="status">Avalable</h3>

                        </div>


                    </div>



                </div>




            </div>







        </div>



    </div>







    <!-- Register -->


    <div id="room_popup_container" class="room_popup_overlay">
        <div class="room_popup_box">


            <div class="room_popup_image_section">
                <img id="room_popup_image_preview" src="../images/logos/studyroom.png" alt="Room Image">
                <span id="room_popup_upload" class="room_popup_upload_btn">Upload new photo</span>
            </div>


            <div class="room_popup_details">
                <h2>Register Room</h2>

                <label>Room Name:</label>
                <input type="text" id="room_popup_name" placeholder="Enter Room Name">

                <label>Number of Students:</label>
                <input type="number" id="room_popup_students" placeholder="Enter Number of Students">

                <label>Number of Chairs:</label>
                <input type="number" id="room_popup_chairs" placeholder="Enter Number of Chairs">

                <label>Number of Tables:</label>
                <input type="number" id="room_popup_tables" placeholder="Enter Number of Tables">

                <label>Room Status:</label>
                <select id="room_popup_status">
                    <option value="Available">Available</option>
                    <option value="Occupied">Occupied</option>
                </select>

                <label>Room Key:</label>
                <input type="text" id="room_popup_key" value="R12NYUS2" readonly>


                <div class="room_popup_buttons">
                    <button id="room_popup_close" class="room_popup_cancel">Cancel</button>
                    <button id="room_popup_create" class="room_popup_create">Create</button>
                </div>
            </div>
        </div>
    </div>





    <div id="room_popup" class="register_room_pop">
        <div class="register_room_content">
            <div class="register_room_header">
                <h2>Register A Room</h2>
                <button class="register_room_close"
                    onclick="document.getElementById('room_popup').style.display='none'">×</button>
            </div>

            <div class="register_room_body">
                <div class="register_room_image">
                    <img id="room_popup_image_preview" src="../images/logos/defaultroom.png" alt="Room Image">
                    <input type="file" id="room_popup_image_input">
                </div>

                <div class="register_room_form">
                    <label>Name:</label>
                    <input type="text" id="room_popup_name" placeholder="Enter Room Name">

                    <label>Students:</label>
                    <input type="number" id="room_popup_students" placeholder="Number of Students">

                    <label>Chairs:</label>
                    <input type="number" id="room_popup_chairs" placeholder="Number of Chairs">

                    <label>Tables:</label>
                    <input type="number" id="room_popup_tables" placeholder="Number of Tables">

                    <label>Status:</label>
                    <select id="room_popup_status">
                        <option value="Available">Available</option>
                        <option value="Maintenancee">Maintenancee</option>
                        <option value="Not Available">Not Avalable</option>
                    </select>
                </div>
            </div>

            <div class="register_room_footer">
                <button class="register_room_cancel"
                    onclick="document.getElementById('room_popup').style.display='none'">Cancel</button>
                <button id="room_popup_create" class="register_room_create">Create</button>
            </div>
        </div>
    </div>






























    <div id="room-edit-overlay" class="room-edit-overlay">
        <div class="room-edit-popup">

            <!-- Header with Close Button -->
            <div class="room-edit-header">
                <span>Edit Rooms</span>
                <button id="room-edit-close" class="room-edit-close">&times;</button>
            </div>


            <div class="room-edit-image-container">
                <img id="vic" src="../images/logos/studyroom.png" alt="Room Image">
                <span class="room-edit-upload-btn">Upload new photo</span>
            </div>

            <p>ID: <strong>R12NYUS2</strong></p>


            <div class="room-edit-form">
                <label>Name:</label>
                <input type="text" id="roomid_input" value="Study Room 1">

                <label>Students:</label>
                <input type="number" id="student_id" value="5">

                <label>Chairs:</label>
                <input type="number" id="chair_id" value="5">

                <label>Tables:</label>
                <input type="number" id="table_id" value="1">

                <label>Status:</label>
                <select id="choices">
                    <option value="Available">Available</option>
                    <option value="Maintenancee">Maintenancee</option>
                    <option value="Not Available">Not Avalable</option>

                </select>
            </div>


            <div class="room-edit-footer">
                <button class="room-edit-btn room-edit-btn-delete">Delete</button>
                <button class="room-edit-btn room-edit-btn-update">Update</button>
            </div>
        </div>
    </div>






























    <div class="modal" id="profileModal">
        <div class="modal-content">
            <div class="modal-header">
                <button class="close-btn" onclick="closeModal()">×</button>
                <img src="../../User/images/icons/profile.png" alt="Profile">
                <h2>Admin</h2>
            </div>
            <div class="modal-footer">
                <button class="logout-btn" onclick="showLoading('loginAdmin.html')">Log out</button>
            </div>
        </div>
    </div>

    <script>
        function openModal() {
            document.getElementById("profileModal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("profileModal").style.display = "none";
        }

    </script>




    <div class="popup" id="loadingPopup">
        <div class="popup-content">
            <p>Please Wait a Moment....</p>
            <img src="../../User/images/logos/medstudyLogo.png" alt="Loading" class="loading-image">
        </div>
    </div>

    <script>
        function showLoading(redirectUrl) {
            document.getElementById('loadingPopup').style.display = 'flex';
            setTimeout(() => {
                window.location.href = redirectUrl;
            }, 3000);
        }
    </script>





    <div id="pop_up_delete_confirmation_overlay" class="pop_up_delete_confirmation_overlay">
        <div class="pop_up_delete_confirmation_box">
            <p>Do you want to delete?</p>
            <div class="pop_up_delete_confirmation_buttons">
                <button id="pop_up_delete_cancel_button" class="pop_up_delete_confirmation_button">No</button>
                <button id="pop_up_delete_confirm_button" class="pop_up_delete_confirmation_button">Yes</button>
            </div>
        </div>
    </div>










    <script src="../js/dashboard.js"></script>
    <script src="../js/rooms.js"></script>


</body>



</html>
