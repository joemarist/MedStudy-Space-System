<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedStudy | Log In</title>
    <link rel="stylesheet" href="..\css\logIn.css">
    <link rel="icon" href="..\images\logos\medstudyLogo.png">
</head>
<body>
    <div class="container">
        <div class="welcomeImage">
            <img src="..\images\logos\medstudyresized.png" alt="">
            <br>
            <br>
            <span class="doctors">
                <img src="..\images\logos\doctors.png" alt="">
            </span>
        </div>
        <div class="logIn">
            <h1>Hello</h1>
            <span><h1>Welcome Back!</h1></span>

            <div class="logInForm">
                <h2>
                    <span>Login</span>
                    your account
                </h2>
                <form action="">
                    <input type="email" name="email" placeholder="Email">
                    <br>
                    <input type="password" name="password" placeholder="Password">
                    <br>
                    <a href="">forgot password?</a>
                    <br><br>
                    <button type="button" onclick=" showLoading('home.html')">Log In</button>
                    <br>
                    <p>OR</p>
                    <br>
                    <button type="button" onclick=" showLoading('home.html')"><img src="..\images\logos\google.png" alt="">
                        <span>Log In with Google</span>
                    </button>
                </form>
            </div>
        </div>
    </div>

<!--Loaiding-->

    <div class="popup" id="loadingPopup">
        <div class="popup-content">
            <p>Please Wait a Moment....</p>
            <img src="../images/logos/medstudyLogo.png" alt="Loading" class="loading-image">
        </div>
    </div>

    <script>
        function showLoading(redirectUrl) {
            document.getElementById('loadingPopup').style.display = 'flex';
            setTimeout(() => {
                window.location.href = redirectUrl;
            }, 3000);
        }
    </script>

    <!--Function for hotkey switch to Admin-->
    <script>
        document.addEventListener("keydown", function(event) {
        if (event.altKey && event.key.toLowerCase() === "a") {
            event.preventDefault();
            window.location.href = "/Admin/html/loginAdmin.html";
        }
        });
    </script>

</body>
</html>
